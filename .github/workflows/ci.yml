name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Preserve this repository's existing peer-dependency resolution.
      - run: npm ci --legacy-peer-deps
      # next.config currently skips TS errors; enforce them explicitly here.
      - run: npx tsc --noEmit
      - run: npm run build
  python-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No service credentials, real audio, model downloads or paid API calls.
      # This checks syntax only, not NeMo compatibility or inference.
      - run: python -m compileall -q backend *.py

  backend-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      # Resolve manifests without downloading model weights or installing the ML stack.
      - run: uv pip compile backend/requirements.txt --python-version 3.12 -o /tmp/speaker-resolved.txt
      # Real Flask/CORS versions, inert speech provider imports, synthetic data only.
      - run: uv run --no-project --with flask==3.1.3 --with flask-cors==6.0.0 python -m unittest discover -s backend -p 'test_api_smoke.py' -v
